<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Loan Application - Stanbic Bank Uganda</title>
  <link rel="stylesheet" href="dlac.css">
</head>
<body>

  <header>
    <h1>Stanbic Bank Uganda</h1>
  </header>

  <nav>
    <a href="index.html">Loan Products</a>
    <a href="personal-loan.html">Personal Loan Application</a>
  </nav>

  <main>
    <form action="#" method="post">
      <fieldset>
        <legend>Personal Loan Application</legend>

        <label for="title">Title</label>
        <select id="title" name="title">
          <option>Mr</option>
          <option>Mrs</option>
          <option>Miss</option>
          <option>Dr</option>
        </select>

        <label for="first">First Name</label>
        <input type="text" id="first" name="first" required>

        <label for="last">Last Name</label>
        <input type="text" id="last" name="last" required>

        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email">

        <label for="district">District</label>
        <select id="district" name="district">
          <option>Kampala</option>
          <option>Wakiso</option>
          <option>Mukono</option>
          <option>Jinja</option>
          <option>Mbarara</option>
        </select>

        <label for="salary">Monthly Salary (UGX)</label>
        <input type="number" id="salary" name="salary" min="300000">

        <!-- Eligibility message: inline CSS only here -->
        <p style="background:#EAF3DE; color:#27500A; padding:8px;">You appear eligible for this loan.</p>

        <label for="amount">Loan Amount Requested (UGX)</label>
        <input type="number" id="amount" name="amount">

        <label for="period">Repayment Period</label>
        <select id="period" name="period">
          <option>12 months</option>
          <option>24 months</option>
          <option>36 months</option>
        </select>

        <label for="purpose">Loan Purpose</label>
        <select id="purpose" name="purpose">
          <option>School Fees</option>
          <option>Medical</option>
          <option>Home Improvement</option>
          <option>Other</option>
        </select>

        <div class="declaration">
          <input type="checkbox" id="declare" name="declare" required>
          <label for="declare">I confirm that the information provided is accurate.</label>
        </div>

        <button type="submit" class="submit-btn">Submit Application</button>
      </fieldset>
    </form>
  </main>

  <footer>
    &copy; 2026 Stanbic Bank Uganda
  </footer>

</body>
</html>
